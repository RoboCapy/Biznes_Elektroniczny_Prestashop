name: plik konfiguracyjny pipeline wyzwalany automatycznie po zdarzeniu push do gałęzi main/dev 

on:
  push:
    branches: [ "main", "dev" ] 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repo 
        uses: actions/checkout@v3

      - name: Logowanie do Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: budowanie nowego obrazu na klastrze
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: seredvskv/biznes-elektroniczny:latest